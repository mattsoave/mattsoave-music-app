<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano practice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#006970">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Material 3 color roles. Light by default, dark follows the device. */
  :root {
    color-scheme: light dark;
    --md-sys-color-primary: #006970;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-primary-container: #9cf0f8;
    --md-sys-color-on-primary-container: #002022;
    --md-sys-color-secondary-container: #cce8ea;
    --md-sys-color-on-secondary-container: #051f21;
    --md-sys-color-tertiary: #7a5a00;
    --md-sys-color-surface: #f4fafa;
    --md-sys-color-on-surface: #161d1d;
    --md-sys-color-on-surface-variant: #3f4949;
    --md-sys-color-surface-container: #e9efef;
    --md-sys-color-surface-container-highest: #dde4e4;
    --md-sys-color-outline: #6f7979;
    --md-sys-color-outline-variant: #bec8c9;
    --md-sys-color-surface-variant: #dae4e5;
    --md-sys-color-error: #ba1a1a;
    --md-sys-color-error-container: #ffdad6;
    --md-sys-color-on-error-container: #410002;
    --good: #2e7d32;
    --good-container: #c8e6c9;
    --on-good-container: #0b2a0d;
    --paper: #fffdf8; /* sheet music and white keys stay light in dark mode */
    --ink: #1a1b20;
    --md-ref-typeface-brand: Roboto, system-ui, sans-serif;
    --md-ref-typeface-plain: Roboto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-sys-color-primary: #4fd8e3;
      --md-sys-color-on-primary: #00363a;
      --md-sys-color-primary-container: #004f54;
      --md-sys-color-on-primary-container: #9cf0f8;
      --md-sys-color-secondary-container: #304b4d;
      --md-sys-color-on-secondary-container: #cce8ea;
      --md-sys-color-tertiary: #f0c04a;
      --md-sys-color-surface: #0e1415;
      --md-sys-color-on-surface: #dde4e4;
      --md-sys-color-on-surface-variant: #bec8c9;
      --md-sys-color-surface-container: #1a2121;
      --md-sys-color-surface-container-highest: #2f3636;
      --md-sys-color-outline: #899393;
      --md-sys-color-outline-variant: #3f4949;
      --md-sys-color-surface-variant: #3f4949;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --good: #81c995;
      --good-container: #1b5e20;
      --on-good-container: #c8e6c9;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); font-family: var(--md-ref-typeface-plain); }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(112px + env(safe-area-inset-bottom)); }
  h1, h2, h3, p { margin: 0; }
  [hidden] { display: none !important; }

  .top { padding: 12px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .top .meta { color: var(--md-sys-color-on-surface-variant); }
  .card { background: var(--md-sys-color-surface-container); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .card > h2 { margin-bottom: 10px; }
  .hint { color: var(--md-sys-color-on-surface-variant); margin-top: 10px; }
  .label { color: var(--md-sys-color-on-surface-variant); margin: 14px 0 6px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .gap { height: 12px; }
  .top-switch { margin: 4px 0 12px; }
  .full { width: 100%; }
  md-outlined-segmented-button-set, md-outlined-select, md-outlined-text-field { width: 100%; }
  md-chip-set { display: block; }
  .prompt { margin-top: 8px; }
  .feedback { min-height: 1.6em; margin: 6px 0 10px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--md-sys-color-error); }

  /* Bottom navigation */
  .navwrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--md-sys-color-surface-container); padding-bottom: env(safe-area-inset-bottom); }
  md-navigation-bar { max-width: 640px; margin: 0 auto; --md-navigation-bar-container-color: transparent; }
  md-navigation-tab svg { width: 24px; height: 24px; fill: currentColor; }

  /* Staff */
  .staff-box { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 6px; max-width: 360px; margin: 0 auto; min-height: 120px; }
  .staff-box svg.staff { width: 100%; height: auto; display: block; }
  .big-name { padding: 44px 0; text-align: center; }

  /* Answer buttons */
  .letters, .choices { display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); }
  .letters { grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .letter, .choice {
    width: 100%; min-width: 0;
    --md-filled-tonal-button-container-height: 52px;
    --md-filled-tonal-button-leading-space: 6px; --md-filled-tonal-button-trailing-space: 6px;
  }
  .letter { --md-filled-tonal-button-container-height: 60px; --md-filled-tonal-button-leading-space: 0; --md-filled-tonal-button-trailing-space: 0; --md-filled-tonal-button-label-text-size: 1.25rem; }
  .letter[data-state="good"], .choice[data-state="good"] {
    --md-filled-tonal-button-container-color: var(--good-container);
    --md-filled-tonal-button-label-text-color: var(--on-good-container);
    --md-filled-tonal-button-hover-label-text-color: var(--on-good-container);
    --md-filled-tonal-button-focus-label-text-color: var(--on-good-container);
    --md-filled-tonal-button-pressed-label-text-color: var(--on-good-container);
  }
  .letter[data-state="bad"], .choice[data-state="bad"] {
    --md-filled-tonal-button-container-color: var(--md-sys-color-error-container);
    --md-filled-tonal-button-label-text-color: var(--md-sys-color-on-error-container);
    --md-filled-tonal-button-hover-label-text-color: var(--md-sys-color-on-error-container);
    --md-filled-tonal-button-focus-label-text-color: var(--md-sys-color-on-error-container);
    --md-filled-tonal-button-pressed-label-text-color: var(--md-sys-color-on-error-container);
  }
  .trouble { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-radius: 999px; padding: 4px 10px; font-size: .8rem; }

  /* Keyboard */
  .kb-scroll { overflow-x: auto; overflow-y: hidden; border-radius: 12px; margin-top: 10px; touch-action: pan-x; background: var(--md-sys-color-surface-container-highest); padding-bottom: 2px; }
  .kb { position: relative; height: 150px; }
  .key { position: absolute; top: 0; margin: 0; padding: 0; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
  .key.white { height: 100%; background: var(--paper); border: 1px solid var(--md-sys-color-outline); border-radius: 0 0 6px 6px; }
  .key.black { height: 60%; background: var(--ink); border: 1px solid var(--ink); border-radius: 0 0 4px 4px; z-index: 2; }
  .key .kb-label { position: absolute; bottom: 4px; left: 0; right: 0; font-size: .65rem; color: var(--ink); opacity: .7; text-align: center; }
  .key.mark-on, .key.mark-good { background: var(--md-sys-color-primary); }
  .key.mark-good.white { background: var(--good); }
  .key.mark-bad { background: var(--md-sys-color-error); }
  .key.mark-on .kb-label, .key.mark-good .kb-label { color: #fff; opacity: 1; }

  /* Tables and chord rows */
  table.sheet { width: 100%; border-collapse: collapse; text-align: center; }
  table.sheet th, table.sheet td { padding: 6px 4px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
  .chord-table { display: grid; gap: 6px; margin-top: 8px; }
  .chord-row { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 8px; align-items: baseline; text-align: left; border: 0; border-radius: 12px; padding: 12px 14px; color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface-container-highest); font: inherit; cursor: pointer; }
  .chord-row:active { background: var(--md-sys-color-primary-container); }
  .chord-row .roman { color: var(--md-sys-color-primary); }
  .chord-row .cnotes { color: var(--md-sys-color-on-surface-variant); }

  /* Metronome */
  .metro-top { text-align: center; padding: 8px 0 4px; }
  .bpm { line-height: 1.05; }
  .tempo-name { color: var(--md-sys-color-primary); margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 12px; margin: 14px 0; min-height: 22px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--md-sys-color-outline); transition: background-color .06s, transform .06s; }
  .dot.first { border-color: var(--md-sys-color-primary); }
  .dot.on { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); transform: scale(1.2); }
  .row-center { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .slider { display: flex; margin-top: 16px; }
  .slider input { flex: 1; accent-color: var(--md-sys-color-primary); height: 32px; }
  .big-start { min-width: 8em; --md-filled-button-container-height: 56px; }

  /* Songs */
  .chart { overflow-x: auto; font-family: ui-monospace, 'Roboto Mono', Menlo, monospace; font-size: 12.5px; line-height: 1.45; }
  .cl { white-space: pre; }
  .cl.section { font-weight: 700; color: var(--md-sys-color-tertiary); margin-top: 8px; }
  .cl .ch { color: var(--md-sys-color-primary); font-weight: 700; }
  .song-title { margin-bottom: 2px; }
  .linkbtn { color: var(--md-sys-color-primary); text-decoration: none; padding: 8px 0; }
  .mono-field { --md-outlined-text-field-input-text-font: ui-monospace, Menlo, monospace; }
  md-list { background: transparent; --md-list-container-color: transparent; }
  md-list-item { --md-list-item-container-color: transparent; --md-list-item-supporting-text-color: var(--md-sys-color-on-surface-variant); }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--md-sys-color-on-surface); color: var(--md-sys-color-surface); padding: 10px 16px; border-radius: 12px; z-index: 20; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
<script type="module" src="vendor/material.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <div class="top">
    <h1 class="md-typescale-headline-medium" id="title">Piano practice</h1>
    <span class="meta md-typescale-body-small">v<span id="ver"></span> &middot; <span id="net">checking...</span></span>
  </div>
  <div id="view"></div>
</main>
<div class="navwrap" id="navwrap"></div>
</body>
</html>
  <div id="feedback"></div>
